name: Build the Mac app

# Builds HiveLogic for Mac on a GitHub Mac machine and keeps the result as a downloadable file (Actions run page, "Artifacts").
# Not published to a release: nobody's auto-update is touched. Run it by hand from the Actions tab, or it runs on a push to a
# branch named feat/mac-*.
on:
  workflow_dispatch:
  push:
    branches: ['feat/mac-*']

permissions:
  contents: read

jobs:
  build_mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the Mac app (ad hoc signed, not notarized)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          HL_ADHOC_SIGN: '1'
        run: |
          npm run build:mac -- --publish never -c.mac.identity=null
          for app in dist/mac*/*.app; do
            codesign --verify --deep --strict "$app"
            echo "Signature ok: $app"
          done
          echo "Mac app Info.plist keys:"
          for app in dist/mac*/*.app; do
            /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$app/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$app/Contents/Info.plist"
            codesign -d --entitlements - "$app" 2>&1 | grep -E "audio-input|camera" || { echo "::error::microphone/camera entitlements missing in $app"; exit 1; }
          done
          ls -la dist
      - name: Smoke test, the packaged app really starts on a Mac
        run: |
          APP="$(ls -d dist/mac-universal/*.app | head -1)"
          LOG="$HOME/Library/Logs/HiveLogic/hivelogic.log"
          rm -f "$LOG"
          HL_SMOKE_TEST=1 HL_APP_URL="file://$PWD/assets/offline.html" "$APP/Contents/MacOS/HiveLogic" --no-sandbox &
          PID=$!
          for i in $(seq 1 60); do
            kill -0 $PID 2>/dev/null || break
            sleep 1
          done
          kill -0 $PID 2>/dev/null && { echo "::error::the app is still running after 60 seconds"; kill $PID; }
          echo "--- log ---"; cat "$LOG" || { echo "::error::no log file: the app never started"; exit 1; }
          grep -q "^.* launch " "$LOG" || { echo "::error::no launch line in the log"; exit 1; }
          grep -q "smoke ok" "$LOG" || { echo "::error::the window never opened or the page never finished"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: HiveLogic-Mac
          path: |
            dist/HiveLogic-Mac.dmg
            dist/HiveLogic-Mac.zip
          if-no-files-found: error
